<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <meta name="theme-color" content="#07101a">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="<%= BASE_URL %>Logomark.ico" type="image/x-icon">
    <title>Stars Station Studio — Video Production & Creative Content</title>
    <meta name="description" content="Stars Station Studio creates video production, advertising videos, social content, music clips and cinematic stories in Switzerland.">
    <meta name="keywords" content="video production, advertising video, social media content, video editing, music video, Stars Station Studio">
    <link rel="canonical" href="https://www.starsstation.ch">
    <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_URL %>favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_URL %>favicon-16x16.png">

    <meta property="og:title" content="Stars Station Studio">
    <meta property="og:description" content="Video production, advertising, social content, video editing and music clips.">
    <meta property="og:image" content="https://www.starsstation.ch/image.jpg">
    <meta property="og:url" content="https://www.starsstation.ch">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Stars Station Studio",
      "url": "https://www.starsstation.ch",
      "logo": "https://www.starsstation.ch/logo.jpg",
      "description": "Creative video production studio for advertising, social media, editing, music videos and cinematic stories."
    }
    </script>
  </head>
  <body>
    <noscript>Stars Station Studio requires JavaScript to display the interactive website.</noscript>
    <div id="app"></div>
  </body>
</html>
